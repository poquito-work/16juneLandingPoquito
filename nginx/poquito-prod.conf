# HTTP → HTTPS non-www
server {
    listen 80;
    listen [::]:80;

    server_name pocketdragon.in www.pocketdragon.in;

    return 301 https://pocketdragon.in$request_uri;
}


# HTTPS www → HTTPS non-www
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name www.pocketdragon.in;

    ssl_certificate /etc/letsencrypt/live/pocketdragon.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocketdragon.in/privkey.pem;

    return 301 https://pocketdragon.in$request_uri;
}


# Main website - canonical domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pocketdragon.in;

    ssl_certificate /etc/letsencrypt/live/pocketdragon.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pocketdragon.in/privkey.pem;

